server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    persist-authorization: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      # Supabase's pooler (session mode) caps the whole project to 15 backend
      # connections. Hikari's own default (minimumIdle = maximumPoolSize = 10)
      # would let a single instance claim 10 of those at startup, whether or
      # not it's handling traffic — two instances running at once (e.g. a
      # local dev run alongside the deployed app) already exceeds the limit.
      # Keep this small and let it grow lazily instead.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1700000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            # MUST equal the URI registered in Google Cloud Console.
            # On Render set APP_BACKEND_URL=https://oauth2-0-be.onrender.com
            # (without this, Spring defaults to localhost:8080 and OAuth breaks).
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            # MUST equal the URI registered in the GitHub OAuth App.
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/github"

app:
  # Where OAuthSuccessHandler sends the browser after login (frontend).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 900000
    refresh-expiration: 2592000000
    issuer: ${APP_JWT_ISSUER:oauth2-be}
    audience: ${APP_JWT_AUDIENCE:oauth2-be-clients}
  revocation:
    # "redis" (default, needed for real multi-instance revocation) or "in-memory" (single-instance/dev fallback).
    store: ${APP_REVOCATION_STORE:redis}
  oauth2:
    http:
      # Bounds for the token-exchange and userinfo calls to Google/GitHub during login
      # (see OAuth2ClientHttpConfig) — without these, an unresponsive provider hangs the
      # request thread indefinitely instead of failing into OAuth2FailureHandler.
      connect-timeout-ms: ${APP_OAUTH2_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${APP_OAUTH2_READ_TIMEOUT_MS:5000}