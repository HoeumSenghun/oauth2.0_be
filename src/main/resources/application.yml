server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    persist-authorization: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth2_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            # Google compares this string exactly; must match a URI registered in the Google Cloud Console.
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/google"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, user:email
            redirect-uri: "${APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/github"

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 900000
    refresh-expiration: 2592000000